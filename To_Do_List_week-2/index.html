<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dashboard ⚡</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-card">
      <div class="header">
        <div>
          <h1>TASK DASHBOARD</h1>
          <p class="subtitle">Keep track of your daily goals</p>
        </div>
        <!-- Total and Completed Badges -->
        <div class="task-counts">
          <span id="total-count" class="badge total">Total: 0</span>
          <span id="completed-count" class="badge completed">Done: 0</span>
        </div>
      </div>

      <!-- Input Section -->
      <div class="input-box">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
        />
        <button onclick="addTask()">+ Add</button>
      </div>

      <ul id="task-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
